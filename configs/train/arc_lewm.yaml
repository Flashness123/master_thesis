# @package _global_

defaults:
  - /data: arc_ls20
  - /model: lewm
  - override /hydra/job_logging: stdout  # log to the terminal only (no lewm.log file)
  - _self_

run_name: ${data.game}_${data.dataset}  # description only; lewm.py saves to models/lewm/<run_name>_<MMDD-HHMM>. Override e.g. run_name=ls20_goose-l1-7_10ep

hydra:
  output_subdir: null  # no .hydra/ folder; lewm.py saves train_config.yaml + hydra_overrides.yaml into the model folder
  run:
    dir: .  # no outputs/<date>/<time>/ folder
seed: 3072
checkpoint_every_steps: 10000  # save checkpoints/step<N>.ckpt (full state) + weights_step<N>.pt; null = only the final weights

planning:  # plan in the real ARC game during training (evaluation/arc_policies.py); every_steps: null = off
  every_steps: null
  mode: goals  # goals: reach single goal states (planning/*); waypoints: complete levels along human solutions (waypoints/*)
  dataset: human_l1-7  # goal states / solutions come from these recorded episodes
  goal_steps: [5, 10, 25]  # goals mode: how many steps after an episode start the goal lies
  waypoint_every: 5  # waypoints mode: every how many frames of the human solution a waypoint is placed
  levels: null  # levels to evaluate (null = all levels in the dataset)
  episodes_per_level: 1
  samples: 200  # action sequences per CEM round
  iterations: 5  # CEM rounds per planned step
  # replan_every: 1  # replan after every action (all runs up to ls20_multi-no-l3_220k_succ0.1_tc_0919-2131)
  replan_every: 5  # actions played per plan (>= horizon = play the whole plan open loop); measured much better than 1 on level 2
# run length in steps instead of epochs: trainer.max_steps=150000 trainer.max_epochs=-1
train_split: 0.8
val_split: 0.1
img_size: 224
embed_dim: 192
sampling:
  success_probability_sampling: 0.2

wm:
  history_size: 3
  # num_preds: 1  # one-step teacher-forced loss (all runs up to ls20_multi-no-l3_delta_warm300k), windows of history_size + 1 = 4 frames
  num_preds: 5  # K: steps imagined from one real frame in the rollout loss; windows are 1 + K = 6 frames

trainer:
  max_epochs: 100
  max_steps: -1  # -1 = run for max_epochs; set e.g. 150000 together with max_epochs=-1
  check_val_every_n_epoch: 1  # validation frequency
  enable_checkpointing: false  # no Lightning default checkpoint (rewritten every epoch); lewm.py saves its own every checkpoint_every_steps
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 1


loader:
  # Small for the current ls20 smoke dataset.
  # We can increase this once we collect real ARC datasets.
  batch_size: 8
  num_workers: 4
  shuffle: true
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true


optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3


loss:
  rollout:
    discount: 0.95  # gamma: step k of the rollout loss is weighted by gamma^(k-1) (Semigroup-JEPA's best value)
  action:
    weight: 0.5  # lambda of Delta-JEPA's action loss; 0 = plain LeWM. Chosen so the action term (~0.5 * 0.6 at convergence) is the same order as the SIGReg term (0.09 * ~1.7);
                # the paper's 10-50 is for an MSE on continuous actions, ours is a cross-entropy that starts near ln 7 = 1.95
    min_changed_cells: 10  # skip transitions that changed at most this many cells: in ls20 those are blocked moves where only the step counter advanced,
                           # so left and right give the SAME next grid and no decoder can tell them apart (35% of transitions; ceiling 0.76 if kept). 0 = use every transition
  opf:  # used only with model=lewm_opf; names = jepa_anything_objective's arguments, values = the paper's for all its world-model tasks
    orthogonality_weight: 0.10  # lambda_orth; 0 = unconstrained heads (control)
    factor_activity_weight: 0.05  # lambda_fac
    encoder_variance_weight: 0.02  # lambda_enc
    factor_min_std: 0.1  # gamma_fac
    encoder_min_std: 0.1  # gamma_enc
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024