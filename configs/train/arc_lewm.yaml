# @package _global_

defaults:
  - /data: arc_ls20
  - /model: lewm
  - _self_

run_name: arc/${data.id}/lewmw
seed: 3072
train_split: 0.9
img_size: 224
embed_dim: 192

wm:
  history_size: 3
  num_preds: 1

trainer:
  max_epochs: 100
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 1


loader:
  # Small for the current ls20 smoke dataset.
  # We can increase this once we collect real ARC datasets.
  batch_size: 8
  num_workers: 4
  shuffle: true
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true


optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3


loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024