# @package _global_

defaults:
  - /data: arc_ls20
  - /model: lewm
  - override /hydra/job_logging: stdout  # log to the terminal only (no lewm.log file)
  - _self_

run_name: ${data.game}_${data.dataset}  # description only; lewm.py saves to models/lewm/<run_name>_<MMDD-HHMM>. Override e.g. run_name=ls20_goose-l1-7_10ep

hydra:
  output_subdir: null  # no .hydra/ folder; lewm.py saves train_config.yaml + hydra_overrides.yaml into the model folder
  run:
    dir: .  # no outputs/<date>/<time>/ folder
seed: 3072
checkpoint_every_steps: 10000  # save checkpoints/step<N>.ckpt (full state) + weights_step<N>.pt; null = only the final weights

planning:  # evaluate in the real ARC game during training along human solutions (PlanningEvaluation in training/lewm.py): planning/*, waypoints/*, next_state/*; every_steps: null = off
  every_steps: null
  dataset: human_l1-7  # goal states / solutions come from these recorded episodes
  goal_steps: [5, 10, 25]  # planning/*: how many steps after an episode start the goal lies
  waypoint_every: 5  # waypoints/*: every how many frames of the human solution a waypoint is placed; next_state/*: how far ahead the goal lies
  levels: null  # levels to evaluate (null = all levels in the dataset)
  episodes_per_level: 1
  samples: 200  # action sequences per CEM round
  iterations: 5  # CEM rounds per planned step
  # replan_every: 1  # replan after every action (all runs up to ls20_multi-no-l3_220k_succ0.1_tc_0919-2131)
  replan_every: 5  # actions played per plan (>= horizon = play the whole plan open loop); measured much better than 1 on level 2
# run length in steps instead of epochs: trainer.max_steps=150000 trainer.max_epochs=-1
train_split: 0.8
val_split: 0.1
img_size: 224
embed_dim: 192
sampling:
  success_probability_sampling: 0.2

extensions:  # defaults = plain LeWM (one_step_loss only); switch on the additions from later papers (their settings are under loss.*)
  one_step_loss: true  # LeWM's own teacher-forced one-step prediction loss; can run alone, with rollout_loss, or be replaced by it (at least one of the two)
  rollout_loss: false  # Semigroup-JEPA (arXiv:2609.10464): imagine wm.num_preds steps from 1, 2, ..., loss.rollout.context real frames (false in all runs up to ls20_multi-no-l3_delta_warm300k; later runs used it instead of one_step_loss)
  tc_sigreg: false  # TC-SIGReg (arXiv:2607.26924): SIGReg on the latents minus their window mean instead of the latents (false in all runs up to ls20_multi-no-l3_220k_succ0.1_0918-1951)
  delta_jepa: false  # Delta-JEPA (arXiv:2606.31232): an action decoder names the action from z_t+1 - z_t (adds model.action_decoder and loss.action)
  fact_heads: false  # heads name the game facts (player cell, energy, refills left, key shape, rotation, colour) from real and imagined latents (adds model.fact_decoder and loss.facts); needs datasets/<game>/<dataset>_facts/ (environments/arc_facts.py)
  latent_shaping: false  # the squared latent distance of two frames of a window follows D^2 of their facts (loss.shaping); needs the same facts
  factor_heads: false  # heads name the look of the screen regions found by training/factor_discovery.py (no game engine, nobody names what matters), from real and imagined latents (adds model.factor_decoder and loss.factors); needs factors.path
  object_heads: false  # heads say where the object families found by training/factor_discovery.py --objects are (which 4x4 patches hold one), from real and imagined latents (adds 256 outputs per family to model.factor_decoder and loss.objects); needs factors.path
  counterfactual_objects: false  # with object_heads: one frame per window is also shown with one object family removed (filled with the frame's most common colour)
  counterfactual_factors: false  # with factor_heads: one frame per window is also shown with another look of one region, taken from its codebook (looks seen in the data)
  counterfactual_keys: false  # with fact_heads and/or latent_shaping: one frame per window is also shown with another key shape, colour or rotation (key_patches.npz of the facts), the only frames that differ in one key property alone

factors:  # extensions.factor_heads / object_heads
  path: null  # folder with factors.npz / factors.json written by training/factor_discovery.py (absolute, or relative to $STABLEWM_HOME)

wm:
  history_size: 3  # latents the predictor attends to; LeWM's one-step loss uses windows of history_size + 1 = 4 frames
  num_preds: 5  # K, only with extensions.rollout_loss: steps imagined from the real frames; windows of loss.rollout.context + K = 8 frames

trainer:
  max_epochs: 100
  max_steps: -1  # -1 = run for max_epochs; set e.g. 150000 together with max_epochs=-1
  check_val_every_n_epoch: 1  # validation frequency
  enable_checkpointing: false  # no Lightning default checkpoint (rewritten every epoch); lewm.py saves its own every checkpoint_every_steps
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
  log_every_n_steps: 1


loader:
  # Small for the current ls20 smoke dataset.
  # We can increase this once we collect real ARC datasets.
  batch_size: 8
  num_workers: 4
  shuffle: true
  drop_last: true
  persistent_workers: true
  prefetch_factor: 2
  pin_memory: true


optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3


loss:
  one_step:  # extensions.one_step_loss
    weight: 1.0
  rollout:  # extensions.rollout_loss
    weight: 1.0
    discount: 0.95  # gamma: step k of the rollout loss is weighted by gamma^(k-1) (Semigroup-JEPA's best value)
    context: ${wm.history_size}  # most real frames a rollout starts from. Every batch rolls out from 1, 2, ..., context real frames to the same K targets and averages the
                                 # losses, like LeWM's one-step loss trains every context length at once: a plan starts from one real frame (the planner only gets the
                                 # current one), longer real histories teach the predictor to use them. Runs before 24.10.26 have no key: they started from 1 real frame
  action:  # extensions.delta_jepa
    weight: 0.5  # lambda of Delta-JEPA's action loss. Chosen so the action term (~0.5 * 0.6 at convergence) is the same order as the SIGReg term (0.09 * ~1.7);
                # the paper's 10-50 is for an MSE on continuous actions, ours is a cross-entropy that starts near ln 7 = 1.95
    min_changed_cells: 10  # skip transitions that changed at most this many cells: in ls20 those are blocked moves where only the step counter advanced,
                           # so left and right give the SAME next grid and no decoder can tell them apart (35% of transitions; ceiling 0.76 if kept). 0 = use every transition
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
  factors:  # extensions.factor_heads
    weight: 0.5  # as loss.facts
  objects:  # extensions.object_heads
    weight: 0.5  # binary cross-entropy over the 256 patches per family (occupied patches count 10 times), the mean over all
  facts:  # extensions.fact_heads
    weight: 0.5  # the mean over the heads starts near 1.7 (cross-entropies of 4-12 classes) and so begins at the size of Delta-JEPA's action term (0.5 * ln 7)
  shaping:  # extensions.latent_shaping
    weight: 0.1  # its normalized squared error is about 1 for an unshaped latent, so it starts at the size of the TC-SIGReg term (0.09 * ~1.7)
    d2:  # D^2 = position |dp|^2 + energy de^2 + refill [refills left differ] + shape [key shape differs] + colour [key colour differs] + rotation d_rot^2; only the proportions count
      position: 1.0  # per cell^2: one move = 1
      energy: 0.01  # per energy unit^2: a move costs 1-2 units (0.01-0.04), a full refill 42 units (~18, about 4 cells)
      refill: 4.0  # a refill taken or not: as far as two cells
      shape: 4.0  # another key shape: as far as two cells
      colour: 4.0  # another key colour: as far as two cells
      rotation: 4.0  # per quarter turn^2: one turn = two cells, a half turn (d_rot = 2) = four cells