# How should our stored Pong trajectories be presented to a model?
type: pong
name: ${oc.env:STABLEWM_HOME}/datasets/pong_random.lance  # which dataset to open
num_steps: ${eval:'${wm.history_size} + ${wm.num_preds}'}  # LeWM history_size=3 + num_preds=1 -> 4 observations.
frameskip: 4  # here is where we wanna use frameskip  (frameskip=4 changes one LeWM transition from “state + one primitive action → next state” into s0 + [a0, a1, a2, a3] → s4), frameskip is a trade of if only 1 it might be trivial

keys_to_load:  # which columns to access in the lance table 
  - pixels
  - action

action:
  # encoding: one_hot  # only descriptive, DiscreteActionOneHot is always applied in the training pipeline
  num_actions: 6  