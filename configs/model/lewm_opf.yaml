# LeWM + Orthogonal Predictive Factorization (JEPA-Anything, arXiv:2609.20800). Select with: model=lewm_opf
# Everything is taken from lewm.yaml; only pred_proj is replaced by one head per factor + pseudoinverse synthesis.
# Default: the authors' qr_retraction mode (P exactly orthogonal after every step) + the paper's factor-space loss.
# Variants (see the OPF note in training/lewm.py):
#   model.opf.orthogonality_mode=soft_gram                                                  soft penalty only: P collapsed in our test
#   model.opf.orthogonality_mode=soft_gram loss.opf.prediction_space=latent                 soft penalty + latent loss (commit 5a1b04e)
#   model.opf.orthogonality_mode=soft_gram loss.opf.orthogonality_weight=0                  no orthogonality at all (the paper's unconstrained baseline)
#   model.opf.learnable=false model.opf.orthogonality_mode=soft_gram                        fixed identity P (factor k = latent coordinates [k*r, (k+1)*r))
defaults:
  - lewm
  - _self_

pred_proj: null

opf:
  _target_: master_thesis.models.lewm.OrthogonalFactorProjection
  state_dim: ${embed_dim}
  num_factors: 4  # K; the latent stays 192-dim, cut into 4 factors of r = 192 / 4 = 48 coordinates
  learnable: true  # the class default is false (fixed basis), as in the original
  orthogonality_mode: qr_retraction  # the class default is soft_gram, as in the original; qr_retraction needs learnable: true
  qr_retraction_frequency: 1  # retract after every optimizer step

factor_heads:
  _target_: master_thesis.models.lewm.FactorHeads
  input_dim: ${embed_dim}
  state_dim: ${embed_dim}
  num_factors: ${model.opf.num_factors}
  hidden_dim: 816  # 4 heads x 816 hidden ≈ the parameters of pred_proj (one head, 2048 hidden), so both variants are the same size
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true
