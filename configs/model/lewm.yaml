# How should the model look like?
_target_: master_thesis.models.lewm.JEPA  # with _target_ it directly tells what class to instntiate (optimizer = instatiate(cfg.optimizer))

encoder:
  _target_: stable_pretraining.backbone.utils.vit_hf
  size: tiny
  patch_size: 14
  image_size: ${img_size} # takes the value from the training config
  pretrained: false
  use_mask_token: false


predictor:
  _target_: master_thesis.models.lewm.ARPredictor
  num_frames: ${wm.history_size}
  input_dim: ${embed_dim}
  hidden_dim: ${embed_dim}
  output_dim: ${embed_dim}
  depth: 6
  heads: 16
  mlp_dim: 2048
  dim_head: 64
  dropout: 0.1
  emb_dropout: 0.0


action_encoder:
  _target_: master_thesis.models.lewm.Embedder
  input_dim: ???  # Filled automatically from the dataset/action configuration.
  emb_dim: ${embed_dim}

action_decoder:  # Delta-JEPA (arXiv:2606.31232): recovers the executed action from the latent difference z_t+1 - z_t; remove this block for plain LeWM
  _target_: master_thesis.models.lewm.MLP
  input_dim: ${embed_dim}
  hidden_dim: 512
  output_dim: 7  # ACTION1..ACTION7 (the 7-way one-hot part of the 9-D action vector)

projector:
  _target_: master_thesis.models.lewm.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true


pred_proj:
  _target_: master_thesis.models.lewm.MLP
  input_dim: ${embed_dim}
  output_dim: ${embed_dim}
  hidden_dim: 2048
  norm_fn:
    _target_: torch.nn.BatchNorm1d
    _partial_: true