data:
  name: ${oc.env:STABLEWM_HOME}/datasets/pong_random.lance
  num_steps: ${eval:'${wm.history_size} + ${wm.num_preds}'}
  frameskip: 4
  keys_to_load:
  - pixels
  - action
  action:
    encoding: one_hot
    num_actions: 6
model:
  _target_: master_thesis.models.lewm.JEPA
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: tiny
    patch_size: 14
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: master_thesis.models.lewm.ARPredictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: master_thesis.models.lewm.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: master_thesis.models.lewm.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: master_thesis.models.lewm.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
run_name: pong/lewm
seed: 3072
train_split: 0.9
img_size: 224
embed_dim: 192
wm:
  history_size: 3
  num_preds: 1
trainer:
  max_epochs: 1
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  gradient_clip_val: 1.0
loader:
  batch_size: 32
  num_workers: 0
  shuffle: true
  drop_last: true
  persistent_workers: false
  prefetch_factor: null
  pin_memory: true
optimizer:
  type: AdamW
  lr: 5.0e-05
  weight_decay: 0.001
loss:
  sigreg:
    weight: 0.09
    kwargs:
      knots: 17
      num_proj: 1024
