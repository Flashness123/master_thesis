[tool.yapf]
based_on_style = "pep8"

indent_width = 2
continuation_indent_width = 2
column_limit = 280

join_multiple_lines = true

split_before_first_argument = false
split_before_named_assigns = false
allow_split_before_default_or_named_assigns = false

split_arguments_when_comma_terminated = false
disable_ending_comma_heuristic = true

split_all_comma_separated_values = false
split_all_top_level_comma_separated_values = false

split_before_closing_bracket = false
split_before_dict_set_generator = false
split_complex_comprehension = false

coalesce_brackets = true

split_penalty_after_opening_bracket = 1000
split_penalty_import_names = 1000
split_penalty_for_added_line_split = 1000

[project]
name = "master-thesis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Flashness123", email = "lukas.kouba.de@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anywidget>=0.11.0",
    "arc-agi>=0.9.9",
    "einops==0.8.2",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.10.9",
    "nbformat>=5.11.1",
    "pillow>=12.3.0",
    "plotly>=7.1.0",
    "stable-pretraining==0.1.8",
    "stable-worldmodel[env,format,train]==0.1.1",
    "tensorboard>=2.21.0",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "umap-learn>=0.5.12",
]

[project.scripts]
master-thesis = "master_thesis:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "yapf>=0.43.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
stable-worldmodel = { git = "https://github.com/galilai-group/stable-worldmodel.git", rev = "b72edab" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
